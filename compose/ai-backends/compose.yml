networks:
  lan:
      external: true

services:

  gemini-web2api:
    build: https://github.com/Sophomoresty/gemini-web2api.git
    container_name: gemini-web2api
    networks:
      - lan
    # ports:
    #   - "8081:8081"
    volumes:
      - ${DATA}/geminiweb2api/config.json:/app/config.json
      - ${DATA}/geminiweb2api/cookie.txt:/app/cookie.txt
    # environment:
    #   - HTTP_PROXY=${WS_RES_PROXY}
    restart: unless-stopped

  # studiobuild2api:
  #   # image: hkfires/aistudiobuildws:latest
  #   build: https://github.com/hkfires/AIStudioBuildWS.git
  #   container_name: aibuildws2api
  #   environment:
  #     - CAMOUFOX_INSTANCE_URL=${AIBUILD_URL}
  #     - CAMOUFOX_PROXY=${HTTP_PROXY}
  #   volumes:
  #     - ${DATA}/buildws/cookies:/app/cookies:rw
  #     - ${DATA}/buildws/logs:/app/logs:rw
  #   restart: always
  #   networks:
  #     - lan
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2'       # 限制最多使用 2 个 CPU 核心
  #         memory: 4G        # 限制内存最大为 2GB
  #       reservations:
  #         memory: 2G      # 保证至少分配 512M 内存

  aistudio2api:
    image: ghcr.io/ibuhub/aistudio-to-api:latest
    container_name: aistudio2api
    networks:
      - lan
    # ports:
    #   - 7860:7860
    restart: unless-stopped
    volumes:
      - ${DATA}/aistudio2api/auth:/app/configs/auth
      - ${DATA}/aistudio2api/data:/app/data
    environment:
      API_KEYS: ${CLAUDE_API_KEY}
      TZ: Asia/Shanghai
      WEB_CONSOLE_USERNAME: ${CLAUDE_ADMIN_USER}
      WEB_CONSOLE_PASSWORD: ${CLAUDE_ADMIN_PASS}
      HTTP_PROXY: ${GLUETUN_PROXY}

  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    networks:
      - lan
    ports:
      - "8317:8317"
      # - "8085:8085"
      # - "1455:1455"
      # - "54545:54545"
      # - "11451:11451"
      # - "51121:51121"
    volumes:
      - ${DATA}/CLIProxyAPI/config.yaml:/CLIProxyAPI/config.yaml
      - ${DATA}/CLIProxyAPI/auths:/root/.cli-proxy-api
      - ${DATA}/CLIProxyAPI/logs:/CLIProxyAPI/logs
    restart: unless-stopped

  grok2api:
    image: ghcr.io/chenyme/grok2api:latest
    container_name: grok2api
    # ports:
    #   - "18000:8000"
    volumes:
      - ${DATA}/grok2api/config.yaml:/run/grok2api/config.yaml:ro"
      - ${DATA}/grok2api/data:/app/data
      - ${DATA}/grok2api/state:/var/lib/grok2api-quality-guard
    environment:
      TZ: Asia/Shanghai
      # 非空时覆盖 config.yaml 的 PostgreSQL DSN，并自动启用 postgres。
      # GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      # GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
    networks:
      - lan
    restart: always
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  ## 在管理端将 Clearance 模式设为 FlareSolverr 或按需刷新，并使用 http://flaresolverr:8191。
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
    networks:
      - lan
    restart: unless-stopped

  claude2api:
    image: pushzx/claude2api:latest-arm64
    container_name: claude2api
    restart: unless-stopped
    networks:
      - lan
    # ports:
    #   - "${PORT:-8080}:8080"
    environment:
      - LISTEN_ADDR=:8080
      - CLAUDE_SESSION_KEYS=${CLAUDE_SESSION_KEYS}
      - ADMIN_USER=${CLAUDE_ADMIN_USER}
      - ADMIN_PASS=${CLAUDE_ADMIN_PASS}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - PROXY_HOST=http://gluetun
      - PROXY_PORT=8888

  # freebuff2api:
